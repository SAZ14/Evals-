[project]
name = "ledger"
version = "0.1.0"
description = "Ledger: an eval harness that tests whether AI agents tell the truth about money."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
